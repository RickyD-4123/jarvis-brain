<!doctype html>
<!-- A company-site form with no known structure: fields are mapped by their label text. Test data only. -->
<html><head><meta charset="utf-8"><title>Apply - Hooli</title></head>
<body><h1>Software Engineering Intern</h1>
<form id="apply" onsubmit="window.__submitted = 1; event.preventDefault();">
  <p><label for="fn">Full name *</label> <input id="fn" name="fullname" required></p>
  <p><label for="em">Email address *</label> <input id="em" name="email" type="email" required></p>
  <p><label for="ph">Phone number</label> <input id="ph" name="phone" type="tel"></p>
  <p><label for="cv">Upload your CV *</label> <input id="cv" name="cv" type="file" required></p>
  <p><label for="why">Why do you want to join Hooli? *</label> <textarea id="why" name="why" required></textarea></p>
  <p><label for="sal">Salary expectations</label> <input id="sal" name="salary"></p>
  <fieldset><legend>Gender (optional)</legend>
    <label><input type="radio" name="g" value="f"> Female</label> <label><input type="radio" name="g" value="m"> Male</label>
    <label><input type="radio" name="g" value="n"> Prefer not to say</label></fieldset>
  <button type="submit" onclick="window.__clicked = 1">Submit</button>
</form></body></html>
