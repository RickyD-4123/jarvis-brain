<!doctype html>
<!-- A careers portal that wants you to create an account first (name, email, password). Test data only. -->
<html><head><meta charset="utf-8"><title>Create your candidate account</title></head>
<body><h1>Create your candidate account to apply</h1>
<form id="signup" onsubmit="window.__submitted = 1; event.preventDefault();">
  <p><label for="fn">Full name</label> <input id="fn"></p>
  <p><label for="em">Email</label> <input id="em" type="email"></p>
  <p><label for="pw">Choose a password</label> <input id="pw" type="password"></p>
  <p><label for="pw2">Confirm password</label> <input id="pw2" type="password"></p>
  <button type="submit" onclick="window.__clicked = 1">Create account</button>
</form></body></html>
